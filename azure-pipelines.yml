# Node.js
# Build a general Node.js project with npm.
# Add steps that analyze code, save build artifacts, deploy, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/javascript

trigger:
- master

pool:
  vmImage: ubuntu-latest

# variables to be used and the group name of the variables
#variables:
#  - group: aws-docs-deploy

steps:

- checkout: self
  fetchDepth: 0

- task: NodeTool@0
  inputs:
    versionSpec: '22.x'
  displayName: 'Install Node.js'

- task: Bash@3
  displayName: 'Install AWS CLI'
  inputs:
    # specifies that the script is written directly within the YAML file
    targetType: 'inline'
    script: |
      curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
      unzip awscliv2.zip
      sudo ./aws/install
      aws --version

- task: DownloadSecureFile@1
  displayName: 'Download PEM file to temp directory of agent'
  inputs:
    secureFile: 'docs_deploy.pem'  
    targetPath: '$(Agent.TempDirectory)'

- script: |
    aws configure set aws_access_key_id "$AWS_ACCESS_KEY_ID"
    aws configure set aws_secret_access_key "$AWS_SECRET_ACCESS_KEY"
    aws configure set region "$AWS_REGION"
  displayName: 'Configure AWS Credentials'
  env:
    AWS_ACCESS_KEY_ID: $(awsAccessKeyID)
    AWS_SECRET_ACCESS_KEY: $(awsSecretAcccessKey)
    AWS_DEFAULT_REGION: $(awsRegion)
    AWS_SG_NAME: $(awsSGName)

# Get the IP of the current agent and set it as variable.
- task: PowerShell@2
  displayName: Get the IP of current agent
  inputs:
    targetType: 'inline'
    script: |
      $IP= Invoke-RestMethod http://ipinfo.io/json | Select -exp ip
      $IP
      Write-Host "##vso[task.setvariable variable=IP]$IP"

- script: |
    python3 scripts/check-a11y-source.py
    python3 scripts/check-a11y-contrast.py
  displayName: 'Accessibility source and contrast checks'

- script: |
    # Install Vale and lint prose across .md and .mdx. Warn-only (continueOnError)
    # to mirror the soft-enforcement of the a11y gates; flip to a hard gate once
    # the backlog is clear.
    curl -sfL https://github.com/errata-ai/vale/releases/download/v3.7.1/vale_3.7.1_Linux_64-bit.tar.gz | sudo tar -xz -C /usr/local/bin vale
    vale --version
    npm run vale
  displayName: 'Vale prose lint (.md + .mdx)'
  continueOnError: true

- script: |
    npm install --force
    npm run build
  displayName: 'npm install and build'

- script: |
    npm install -g @axe-core/cli http-server
    http-server ./build -p 8080 -s &
    HTTPSERVER_PID=$!
    sleep 3
    set +e
    axe http://localhost:8080/index.html \
        http://localhost:8080/cloud/getting-started/what-is-openlm/ \
        http://localhost:8080/privacy-policy/ \
        http://localhost:8080/accessibility/ \
        --tags wcag2a,wcag2aa,wcag21a,wcag21aa \
        --exit
    AXE_EXIT=$?
    kill $HTTPSERVER_PID
    if [ $AXE_EXIT -ne 0 ]; then
      echo "##vso[task.logissue type=warning]axe-core found accessibility violations. Review the log above."
    fi
    # Exit 0 so a11y issues warn but don't block publish. Flip to `exit $AXE_EXIT`
    # once the known-barrier list from the accessibility statement is empty.
    exit 0
  displayName: 'axe-core WCAG 2.1 AA scan on built site'

- script: |
    aws ec2 authorize-security-group-ingress --group-id "$AWS_SG_NAME" --protocol tcp --port 22 --cidr $(IP)/32
  displayName: 'Add agent IP to AWS Security Group'
  env:
    AWS_ACCESS_KEY_ID: $(awsAccessKeyID)
    AWS_SECRET_ACCESS_KEY: $(awsSecretAcccessKey)
    AWS_DEFAULT_REGION: $(awsRegion)
    AWS_SG_NAME: $(awsSGName)

- script: |
    chmod 600 $(Agent.TempDirectory)/docs_deploy.pem
    rsync -chav --delete --omit-dir-times --no-perms \
          -e 'ssh -i $(Agent.TempDirectory)/docs_deploy.pem -o StrictHostKeyChecking=no' \
           ./build/ docs_deploy@openlm.com:/var/www/www/openlm.com/documentation/
  displayName: 'Rsync new build'

- script: |
    aws ec2 revoke-security-group-ingress --group-id "$AWS_SG_NAME" --protocol tcp --port 22 --cidr $(IP)/32
  displayName: 'Delete agent IP from AWS Security Group'
  env:
    AWS_ACCESS_KEY_ID: $(awsAccessKeyID)
    AWS_SECRET_ACCESS_KEY: $(awsSecretAcccessKey)
    AWS_DEFAULT_REGION: $(awsRegion)
    AWS_SG_NAME: $(awsSGName)

# After the new build is live, notify release-notes subscribers if any
# changelog pages changed in this deploy. Best-effort: a missed
# notification never fails the pipeline.
#
# Requires two pipeline variables (set in Azure DevOps → Library or the
# pipeline's Variables tab; the token must match the value bound to the
# Firebase secret NOTIFY_PIPELINE_TOKEN):
#   - notifyUrl                  (e.g. https://europe-west1-zoho-creator-dev.cloudfunctions.net/notifyPagesChanged)
#   - notifyPipelineToken        (the shared secret)
#
# Optional pipeline variable:
#   - notifyReleaseNotesPage     "false" / "0" / "off" silences the
#                                synthetic notification for edits to the
#                                curated /release-notes/ page (both
#                                src/pages/release-notes.js and the JA
#                                mirror). Leave unset (or set "true") to
#                                fire notifications as before. Changelog
#                                .mdx and static/release-notes/*.json
#                                edits notify regardless of this flag.
- script: |
    node scripts/notify-changelog-changes.js
  displayName: 'Notify release-notes subscribers (if changelog changed)'
  continueOnError: true
  env:
    NOTIFY_URL: $(notifyUrl)
    NOTIFY_PIPELINE_TOKEN: $(notifyPipelineToken)
    NOTIFY_RELEASE_NOTES_PAGE: $(notifyReleaseNotesPage)