extends: existence
message: "Use the indicative or imperative mood."
link: https://docs.splunk.com/Documentation/StyleGuide/current/StyleGuide/Subjunctivemood
ignorecase: true
level: warning
# 'should' variants removed: STYLE_GUIDE.md permits "should" for genuine
# recommendations. would/could remain flagged.
tokens:
  - won't
  - would
  - wouldn't
  - would not
  - could
  - couldn't
  - could not
