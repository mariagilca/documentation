<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Banner Preview</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
    background: #f8fafc;
    min-height: 100vh;
  }
  [data-theme='dark'] body { background: #0f172a; }

  h2 { text-align: center; padding: 1.5rem; color: #334155; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.08em; }
  [data-theme='dark'] h2 { color: #94a3b8; }

  /* Fake navbar placeholder */
  .navbar-placeholder {
    height: 60px;
    background: #fff;
    border-bottom: 1px solid #e2e8f0;
    display: flex;
    align-items: center;
    padding: 0 2rem;
    font-weight: 700;
    font-size: 1.1rem;
    color: #1e293b;
  }
  [data-theme='dark'] .navbar-placeholder {
    background: #0f172a;
    border-bottom-color: rgba(96, 165, 250, 0.15);
    color: #f1f5f9;
  }

  /* --- Variables (light) --- */
  :root {
    --rmk-color-text-strong: #1e293b;
    --rmk-color-text-heading: #f1f5f9;
    --rmk-announcement-bg: linear-gradient(120deg, rgba(14, 165, 233, 0.28) 0%, rgba(59, 130, 246, 0.22) 45%, rgba(167, 139, 250, 0.22) 100%);
    --rmk-announcement-border: rgba(21, 95, 160, 0.26);
    --rmk-announcement-text: var(--rmk-color-text-strong);
    --rmk-announcement-link: #155fa0;
    --rmk-announcement-link-strong: #1d4ed8;
    --rmk-announcement-underline: rgba(21, 95, 160, 0.35);
    --rmk-announcement-underline-strong: rgba(37, 99, 235, 0.65);
    --rmk-announcement-link-glow: rgba(21, 95, 160, 0.25);
    --rmk-announcement-close-bg: rgba(21, 95, 160, 0.12);
    --rmk-announcement-glow: radial-gradient(120% 140% at 0% 0%, rgba(110, 231, 255, 0.32), transparent 55%), radial-gradient(120% 140% at 100% 0%, rgba(167, 139, 250, 0.28), transparent 55%);
  }

  /* --- Variables (dark) --- */
  [data-theme='dark'] {
    --rmk-announcement-bg: linear-gradient(120deg, rgba(15, 23, 42, 0.96) 0%, rgba(30, 64, 175, 0.5) 45%, rgba(99, 102, 241, 0.45) 100%);
    --rmk-announcement-border: rgba(96, 165, 250, 0.4);
    --rmk-announcement-text: var(--rmk-color-text-heading);
    --rmk-announcement-link: #93c5fd;
    --rmk-announcement-link-strong: #dbeafe;
    --rmk-announcement-underline: rgba(148, 197, 255, 0.45);
    --rmk-announcement-underline-strong: rgba(110, 231, 255, 0.6);
    --rmk-announcement-link-glow: rgba(110, 231, 255, 0.35);
    --rmk-announcement-close-bg: rgba(96, 165, 250, 0.24);
    --rmk-announcement-glow: radial-gradient(120% 140% at 0% 0%, rgba(110, 231, 255, 0.32), transparent 60%), radial-gradient(120% 140% at 100% 0%, rgba(167, 139, 250, 0.3), transparent 60%);
  }

  /* --- Announcement bar styles --- */
  .announcementBar {
    position: relative;
    overflow: hidden;
    padding: 0.6rem 1.25rem;
    border-bottom: 1px solid var(--rmk-announcement-border);
    background: var(--rmk-announcement-bg);
    color: var(--rmk-announcement-text);
    box-shadow: 0 10px 24px rgba(15, 23, 42, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.5);
  }
  [data-theme='dark'] .announcementBar {
    box-shadow: 0 12px 30px rgba(5, 12, 28, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.08);
  }

  .announcementBar::before {
    content: '';
    position: absolute;
    inset: -80% 0 auto 0;
    height: 200%;
    background: var(--rmk-announcement-glow);
    opacity: 0.85;
    pointer-events: none;
    mix-blend-mode: screen;
    animation: rmkAnnounceGlow 12s ease-in-out infinite;
  }

  .announcementBar::after {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      repeating-linear-gradient(135deg, rgba(21, 95, 160, 0.12) 0, rgba(21, 95, 160, 0.12) 1px, transparent 1px, transparent 6px),
      repeating-linear-gradient(45deg, rgba(14, 165, 233, 0.1) 0, rgba(14, 165, 233, 0.1) 1px, transparent 1px, transparent 8px);
    opacity: 0.4;
    pointer-events: none;
    mix-blend-mode: soft-light;
    animation: rmkAnnounceTexture 16s linear infinite;
  }

  [data-theme='dark'] .announcementBar::after {
    background-image:
      repeating-linear-gradient(135deg, rgba(255, 255, 255, 0.08) 0, rgba(255, 255, 255, 0.08) 1px, transparent 1px, transparent 6px),
      repeating-linear-gradient(45deg, rgba(110, 231, 255, 0.08) 0, rgba(110, 231, 255, 0.08) 1px, transparent 1px, transparent 8px);
    opacity: 0.35;
    mix-blend-mode: screen;
  }

  .announcementBarContent {
    position: relative;
    z-index: 1;
    display: flex;
    justify-content: center;
    text-align: center;
    font-weight: 600;
    letter-spacing: 0.01em;
    font-size: 0.92rem;
  }

  .announcementBarContent a {
    position: relative;
    color: var(--rmk-announcement-link);
    font-weight: 600;
    text-decoration: none;
    padding-bottom: 2px;
    background-image: linear-gradient(90deg, transparent, var(--rmk-announcement-underline), transparent);
    background-size: 0% 2px;
    background-position: 50% 100%;
    background-repeat: no-repeat;
    transition: color 0.2s ease, background-size 0.22s ease, text-shadow 0.2s ease;
  }

  .announcementBarContent a:hover {
    color: var(--rmk-announcement-link-strong);
    text-shadow: 0 0 16px var(--rmk-announcement-link-glow);
    background-size: 100% 2px;
  }

  .announcementBarContent a:last-of-type {
    color: var(--rmk-announcement-link-strong);
    font-weight: 700;
    background-image: linear-gradient(90deg, transparent, var(--rmk-announcement-underline-strong), transparent);
  }

  .announcementBarClose {
    position: absolute;
    right: 1rem;
    top: 50%;
    transform: translateY(-50%);
    z-index: 2;
  }
  .announcementBarClose button {
    background: none;
    border: none;
    border-radius: 999px;
    color: var(--rmk-announcement-text);
    opacity: 0.7;
    cursor: pointer;
    padding: 4px 8px;
    font-size: 1.1rem;
    transition: background 0.2s ease, opacity 0.2s ease;
  }
  .announcementBarClose button:hover {
    opacity: 1;
    background: var(--rmk-announcement-close-bg);
  }

  @keyframes rmkAnnounceGlow {
    0%   { transform: translateX(-10%) translateY(-6%) scale(1); }
    50%  { transform: translateX(8%) translateY(4%) scale(1.06); }
    100% { transform: translateX(-10%) translateY(-6%) scale(1); }
  }
  @keyframes rmkAnnounceTexture {
    0%   { background-position: 0 0, 0 0; }
    100% { background-position: 220px 140px, -260px 200px; }
  }

  @media (max-width: 640px) {
    .announcementBar { padding: 0.75rem 1rem; }
  }

  /* Theme toggle */
  .theme-toggle {
    position: fixed;
    bottom: 2rem;
    right: 2rem;
    z-index: 100;
    padding: 0.6rem 1.2rem;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    background: #fff;
    color: #334155;
    cursor: pointer;
    font-size: 0.85rem;
    font-weight: 600;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  }
  [data-theme='dark'] .theme-toggle {
    background: #1e293b;
    color: #e2e8f0;
    border-color: #475569;
  }

  /* Page content placeholder */
  .page-content {
    max-width: 900px;
    margin: 3rem auto;
    padding: 0 2rem;
    color: #475569;
    line-height: 1.7;
  }
  [data-theme='dark'] .page-content { color: #94a3b8; }
  .page-content .block {
    height: 12px;
    background: #e2e8f0;
    border-radius: 4px;
    margin-bottom: 0.75rem;
  }
  [data-theme='dark'] .page-content .block { background: #1e293b; }
  .page-content .block.short { width: 60%; }
  .page-content .block.med { width: 85%; }
</style>
</head>
<body>

<!-- Announcement banner -->
<div class="announcementBar" role="banner">
  <div class="announcementBarContent">
    <span>Broker v26.4.9 and Applications Manager v26.4.8.607 are live (April 10, 2026). <a href="#">Broker changelog</a> &middot; <a href="#">Applications Manager changelog</a></span>
  </div>
  <div class="announcementBarClose">
    <button aria-label="Close">&times;</button>
  </div>
</div>

<!-- Fake navbar -->
<div class="navbar-placeholder">OpenLM Documentation</div>

<!-- Fake page content -->
<div class="page-content">
  <div class="block"></div>
  <div class="block med"></div>
  <div class="block short"></div>
  <div class="block"></div>
  <div class="block med"></div>
  <div class="block short"></div>
  <div class="block"></div>
  <div class="block"></div>
  <div class="block med"></div>
</div>

<button class="theme-toggle" onclick="toggleTheme()">Toggle dark / light</button>

<script>
function toggleTheme() {
  const html = document.documentElement;
  html.setAttribute('data-theme', html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
}
</script>
</body>
</html>
